name: Jankalyan CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend-build:
    name: Backend Build (Compile Only)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Grant execute permission for mvnw
        run: chmod +x mvnw

      - name: Build with Maven (skip tests - no DB in CI)
        run: ./mvnw clean package -DskipTests -B
        env:
          JWT_SECRET: ci-placeholder-secret-that-is-at-least-32-chars-long-ok
          JWT_EXPIRATION: 900000
          DB_URL: jdbc:mysql://localhost:3306/test
          DB_USERNAME: root
          DB_PASSWORD: root
          CLOUDINARY_CLOUD_NAME: placeholder
          CLOUDINARY_API_KEY: placeholder
          CLOUDINARY_API_SECRET: placeholder
          GOOGLE_CLIENT_ID: placeholder.apps.googleusercontent.com
          GMAIL_USERNAME: placeholder@gmail.com
          GMAIL_APP_PASSWORD: placeholder
          CORS_ALLOWED_ORIGINS: http://localhost:5173
          SPRING_PROFILES_ACTIVE: prod

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build Frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: https://jankalyan-ukon.onrender.com/api/v1
